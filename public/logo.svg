<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390">

  <!-- ═══════ A LETTER ═══════ -->
  <!-- Solid navy A (includes crossbar zone) -->
  <polygon points="15,215 108,12 158,12 250,215 214,215 168,138 78,138 42,215" fill="#1B2E5C"/>
  <!-- White interior triangle of A -->
  <polygon points="133,46 80,136 186,136" fill="white"/>
  <!-- House roof: navy triangle sitting inside white space -->
  <polygon points="133,80 80,135 186,135" fill="#1B2E5C"/>
  <!-- House window — two white panes side by side -->
  <rect x="104" y="153" width="23" height="20" rx="1" fill="white"/>
  <rect x="132" y="153" width="23" height="20" rx="1" fill="white"/>

  <!-- ═══════ L LETTER ═══════ -->
  <rect x="265" y="12" width="44" height="203" fill="#1B2E5C"/>
  <rect x="265" y="178" width="85" height="37" fill="#1B2E5C"/>

  <!-- ═══════ CIRCULAR DUCT / FAN ═══════ -->
  <!-- Concentric rings — 3-D cylinder depth effect -->
  <circle cx="448" cy="96" r="82" fill="#8898B4"/>
  <circle cx="448" cy="96" r="76" fill="#6C7E9C"/>
  <circle cx="448" cy="96" r="71" fill="#A2B0C8"/>
  <circle cx="448" cy="96" r="65" fill="#60728E"/>
  <circle cx="448" cy="96" r="59" fill="#1A2A48"/>
  <!-- 4 curved fan blades (navy) -->
  <path d="M448,96 C433,61 443,36 458,46 C473,56 473,81 448,96 Z" fill="#1B2E5C"/>
  <path d="M448,96 C433,61 443,36 458,46 C473,56 473,81 448,96 Z" fill="#1B2E5C" transform="rotate(90,448,96)"/>
  <path d="M448,96 C433,61 443,36 458,46 C473,56 473,81 448,96 Z" fill="#1B2E5C" transform="rotate(180,448,96)"/>
  <path d="M448,96 C433,61 443,36 458,46 C473,56 473,81 448,96 Z" fill="#1B2E5C" transform="rotate(270,448,96)"/>
  <!-- Centre accent -->
  <circle cx="448" cy="96" r="13" fill="#22B8EC"/>
  <circle cx="448" cy="96" r="5"  fill="white"/>

  <!-- 4-point sparkle stars (sky blue) -->
  <path d="M514,40 L517,31 L520,40 L529,37 L520,46 L517,55 L514,46 L505,49 Z" fill="#22C6FA"/>
  <path d="M527,67 L529,61 L531,67 L537,65 L531,71 L529,77 L527,71 L521,73 Z" fill="#22C6FA"/>
  <path d="M506,18 L507,14 L508,18 L512,17 L508,20 L507,24 L506,20 L502,21 Z" fill="#22C6FA"/>

  <!-- ═══════ BLUE WAVE ═══════ -->
  <path d="M8,213 C70,196 142,226 214,212 C286,198 362,230 432,215 C468,208 512,213 552,218"
        fill="none" stroke="#1EB8E8" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M8,222 C70,205 142,235 214,221 C286,207 362,239 432,224 C468,217 512,222 552,227"
        fill="none" stroke="#1590CB" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- ═══════ AIR DUCT ═══════ -->
  <text x="280" y="298"
        text-anchor="middle"
        font-family="'Arial Black','Franklin Gothic Heavy',Impact,sans-serif"
        font-weight="900"
        font-size="74"
        fill="#1B2E5C">AIR DUCT</text>

  <!-- ═══════ —CLEANING— ═══════ -->
  <rect x="18"  y="321" width="148" height="2.5" fill="#22B8EC"/>
  <text x="280" y="340"
        text-anchor="middle"
        font-family="'Arial Black','Franklin Gothic Heavy',Impact,sans-serif"
        font-weight="900"
        font-size="37"
        fill="#22B8EC"
        letter-spacing="5">CLEANING</text>
  <rect x="394" y="321" width="148" height="2.5" fill="#22B8EC"/>

  <!-- ═══════ —DALLAS— ═══════ -->
  <rect x="54"  y="363" width="152" height="1.5" fill="#8090A8"/>
  <text x="280" y="375"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-weight="600"
        font-size="23"
        fill="#8090A8"
        letter-spacing="9">DALLAS</text>
  <rect x="354" y="363" width="152" height="1.5" fill="#8090A8"/>

</svg>
