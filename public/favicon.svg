<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" fill="white"/>

  <!-- A letter (navy, bold) -->
  <polygon points="4,58 22,6 28,6 46,58 39,58 32,38 18,38 11,58" fill="#1B2E5C"/>
  <!-- White interior triangle of A -->
  <polygon points="25,14 18,37 32,37" fill="white"/>
  <!-- House roof (navy) inside white space -->
  <polygon points="25,22 18,36 32,36" fill="#1B2E5C"/>
  <!-- Window panes (white) -->
  <rect x="19" y="39" width="5" height="5" fill="white" rx="0.5"/>
  <rect x="26" y="39" width="5" height="5" fill="white" rx="0.5"/>

  <!-- L letter (navy) -->
  <rect x="49" y="6"  width="11" height="52" fill="#1B2E5C"/>
  <rect x="49" y="47" width="11" height="11" fill="#1B2E5C"/>

  <!-- Blue wave at bottom -->
  <path d="M2,52 C14,47 26,51 32,49 C38,47 50,43 62,48"
        fill="none" stroke="#22B8EC" stroke-width="3" stroke-linecap="round"/>
</svg>
