<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background -->
  <rect width="32" height="32" rx="5" fill="#1B2E5C"/>

  <!-- "A" — white, bold, with house -->
  <!-- A outer shape -->
  <polygon points="2,30 13,3 19,3 30,30 25,30 21,18 11,18 7,30" fill="white"/>
  <!-- White interior triangle of A (same white = cut from A via navy) -->
  <polygon points="16,8 11,18 21,18" fill="#1B2E5C"/>
  <!-- House roof inside the A -->
  <polygon points="16,11 11,18 21,18" fill="white"/>
  <!-- Window -->
  <rect x="12" y="19" width="4"  height="4" rx="0.5" fill="#1B2E5C"/>
  <rect x="17" y="19" width="4"  height="4" rx="0.5" fill="#1B2E5C"/>

  <!-- Blue wave -->
  <path d="M1,28 C7,25 13,27 16,26 C19,25 25,23 31,26"
        fill="none" stroke="#22B8EC" stroke-width="2" stroke-linecap="round"/>
</svg>
