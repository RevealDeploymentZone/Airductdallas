<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <rect width="32" height="32" rx="6" fill="#0D2348"/>

  <!-- A letter with small house -->
  <polygon points="16,3 24,27 8,27" fill="white"/>
  <!-- Inner hollow -->
  <polygon points="16,9 21,24 11,24" fill="#0D2348"/>
  <!-- Crossbar -->
  <rect x="10" y="18" width="12" height="3" fill="white"/>
  <!-- House roof -->
  <polygon points="16,10 10,16 22,16" fill="white"/>
  <!-- House body -->
  <rect x="11" y="16" width="10" height="7" fill="white"/>
  <!-- Window -->
  <rect x="13" y="17" width="5" height="4" fill="#0D2348"/>

  <!-- Blue wave at bottom -->
  <path d="M2,28 Q10,25 16,27 Q22,29 30,26" stroke="#1A9ED4" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
